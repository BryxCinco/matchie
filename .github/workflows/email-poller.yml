# Polls the job-search inbox over IMAP, classifies job mail, and updates the
# tracker. See workers/email-poller.ts.
#
# Logs are public on a public repo. The worker prints counts and ids only.

name: Email poller

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours at :17 (off the hour, when Actions is least congested)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # failure alert

# Never two pollers at once: they would race on the same messages.
concurrency:
  group: email-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 22.18+ runs .ts files directly (type stripping); no tsx needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Poll inbox
        run: node workers/email-poller.ts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MATCHIE_USER_ID: ${{ secrets.MATCHIE_USER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # GitHub sends no notification when a scheduled run fails; an issue does.
      # One open issue at a time, so a long outage does not file 12 a day.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Email poller failing"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "An open issue already exists; not filing another."
            exit 0
          fi
          gh issue create --title "$title" \
            --body "The email poller failed: $RUN_URL. Check the Gmail app password, the Supabase secrets, and the LLM keys. Close this issue once it is fixed."
